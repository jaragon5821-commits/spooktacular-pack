# Chop's Spooktacular: the mega torch at the Colossal Scarecrow keeps ordinary hostile mobs from spawning in town.
# Every horror creature from the Grand Archive (chapter 4) is taken off the block list ("-" = still allowed to spawn).
# Forge fills in any setting not listed here with its default.
